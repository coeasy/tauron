[workspace]
resolver = "2"
members = ["crates/*"]
# 示例的 Tauri 工程独立构建（自带 tauri/tauri-build 依赖树，不进主 workspace）
exclude = ["examples/minimal-app/src-tauri"]

[workspace.package]
version = "1.0.2"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/coeasy/tauron"
homepage = "https://github.com/coeasy/tauron"
# 不设 `documentation`：本仓库的 docs/ 是架构文档（Markdown），不是 rustdoc 站点，
# 指向它会让 crates.io 的「Documentation」按钮落到非 API 文档上。留空即由
# docs.rs 自动接管。
# 注意：`crates.io` 发布**须按依赖顺序逐个执行**。内部互引用已全部补齐
# `version = "1.0.2"`（cargo 要求 path 依赖同时给出 `version` 才能打包），
# 因此 `cargo package` 本身不再报错；但 `cargo publish` 会在剥离 `path` 之后
# 去 crates.io 解析内部依赖——必须先把被依赖的 crate 发出去，再发依赖方。
# 另：`examples/minimal-app/src-tauri` 被 `exclude` 在外，不参与发布。

[workspace.dependencies]
# ── serde 系：一切边界的唯一校验器（计划 §1.2 第 4 条）─────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ── 错误 ─────────────────────────────────────────────────────────
thiserror = "2"
# ── 正则（schema `pattern` 校验，§4.13）─────────────────────────
regex = "1"
# ── 版本区间（manifest `framework` range，§4.2）──────────────────
semver = { version = "1", features = ["serde"] }
# ── 并发原语（注册表；计划 §4.1 要求 RwLock/ArcSwap，禁全局 Mutex）─
parking_lot = "0.12"
arc-swap = "1"
# ── 标识 ─────────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4", "serde"] }
# ── URL 解析（V4 A96 网络策略；禁止字符串前缀判权）──────────────
url = "2.5.8"
# ── capability-style filesystem handles（V4 A95）────────────────
rustix = { version = "1.1.5", features = ["fs"] }
# ── OS peer credentials for the Linux Local Host reference path ───
libc = "0.2"
# ── 时间 / TTL ───────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde", "clock"] }
# ── 哈希 / 签名（商城验签，§4.18 后续）───────────────────────────
sha2 = "0.10"
hex = "0.4"
# ── HMAC（§4.5 授予集防篡改签名）──────────────────────────────────
hmac = "0.12"
# ── 测试 ─────────────────────────────────────────────────────────
criterion = "0.5"
proptest = "1"
tempfile = "3"
# ── 内部 crate 互引用 ───────────────────────────────────────────
tauron-host = { path = "crates/tauron-host", version = "1.0.2" }
tauron-i18n = { path = "crates/tauron-i18n", version = "1.0.2" }
tauron-notify = { path = "crates/tauron-notify", version = "1.0.2" }
tauron-recovery = { path = "crates/tauron-recovery", version = "1.0.2" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
