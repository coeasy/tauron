# cargo-deny configuration for tauron-shell
# https://github.com/embarkstudios/cargo-deny

[graph]
skip-dirs = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
]
ignore = []
confidence-threshold = 0.8
allow-osi-free = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
skip = []

[advisories]
ignore = []
skip = []
db-urls = ["https://github.com/rustsec/advisories-db"]

[sources]
unknown-registry = "deny"
allow-registry = true
allow-git = false
unknown-git = "deny"
git = []
registry = []
