[package]
name = "tauron-distribute"
description = "§4.19 CI 分发运维：更新通道、灰度批次、崩溃率停发、签名校验"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
# 升级执行侧真实文件效果：zip 解压（与 adapter/market 同参数，非 optional）
# + 包摘要哈希。
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = { workspace = true }
hex = { workspace = true }
# 版本序关系的**单一算术源**在 `tauron-market`（`cmp_version` / `is_downgrade`，
# 含 2³¹ 截断边界的回归测试）。market 的非可选依赖只有 serde/serde_json/thiserror/sha2，
# 全部已在本 crate 依赖集里，因此这条边不引入新的重依赖；`signing` 特性不开。
tauron-market = { path = "../tauron-market", version = "1.1.0" }

[dev-dependencies]
tempfile = { workspace = true }
