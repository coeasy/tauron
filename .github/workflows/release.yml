name: Release

# 触发：推 `v*` tag，或手动触发做一次干跑。
#
# 约定：正式发布 tag 必须从 **CI 已绿的 main** 上打。本工作流不重跑全量测试，
# 只做一件廉价的强校验 —— tag 号与各处版本号必须一致（见 version-check）。
# 这样「打了 v0.2.0 但忘了升版本号」不会产出错版安装包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build artifacts without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ══════════════════════════════════════════════════════════════════
  # tag 号 vs 版本号一致性
  #
  # 本仓库的版本号散落在三处：workspace 的 `[workspace.package] version`
  # （15 个 crate 全部 `version.workspace = true` 继承它）、根 package.json、
  # 以及 20 个 `packages/*/package.json`。任一处掉队都会产出「名字是 0.2.0、
  # 实际是 0.1.0」的产物 —— 这是纯机械可查的漂移，值得一道硬门禁。
  # ══════════════════════════════════════════════════════════════════
  version-check:
    name: 版本号一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: tag 与 Cargo.toml / package.json 必须一致
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            # 手动分支运行只构建当前版本的预览产物，不创建 Release。
            tag=$(node -p "require('./package.json').version")
          fi
          cargo_ws=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          root_pkg=$(node -p "require('./package.json').version")
          echo "tag=${tag}  Cargo.toml=${cargo_ws}  package.json=${root_pkg}"

          rc=0
          if [ "$tag" != "$cargo_ws" ]; then
            echo "::error::tag v${tag} 与 Cargo.toml 的 [workspace.package] version=${cargo_ws} 不一致"
            rc=1
          fi
          if [ "$tag" != "$root_pkg" ]; then
            echo "::error::tag v${tag} 与根 package.json 的 version=${root_pkg} 不一致"
            rc=1
          fi

          # 20 个 npm 包必须与根一致（否则 workspace 内部互引会跨版本）
          node -e '
            const fs = require("fs");
            const want = require("./package.json").version;
            let bad = 0;
            for (const d of fs.readdirSync("packages")) {
              const f = `packages/${d}/package.json`;
              if (!fs.existsSync(f)) continue;
              const v = JSON.parse(fs.readFileSync(f, "utf8")).version;
              if (v !== want) { console.log(`::error::${f} 的 version=${v}，应为 ${want}`); bad++; }
            }
            if (bad) process.exit(1);
            console.log("packages/* 版本号全部一致");
          ' || rc=1

          # 示例工程是**被 workspace exclude 的独立树**，但它才是真正被打包的那个
          # 应用：它的两个版本号掉队，产出的安装包版本就是错的（tag v0.2.0、
          # 安装包却写 0.1.0）。此前这两处不在校验范围内。
          node -e '
            const fs = require("fs");
            const want = require("./package.json").version;
            const f = "examples/minimal-app/package.json";
            const v = JSON.parse(fs.readFileSync(f, "utf8")).version;
            if (v !== want) { console.log(`::error::${f} 的 version=${v}，应为 ${want}`); process.exit(1); }
            console.log("examples/minimal-app/package.json 版本号一致");
          ' || rc=1

          ex_cargo=$(sed -n "s/^version = \"\(.*\)\"$/\1/p" examples/minimal-app/src-tauri/Cargo.toml | head -1)
          echo "examples/minimal-app/src-tauri/Cargo.toml=${ex_cargo}"
          if [ "$tag" != "$ex_cargo" ]; then
            echo "::error::tag v${tag} 与 examples/minimal-app/src-tauri/Cargo.toml 的 version=${ex_cargo} 不一致"
            rc=1
          fi

          ex_tauri=$(node -p "require('./examples/minimal-app/src-tauri/tauri.conf.json').version")
          echo "examples/minimal-app/src-tauri/tauri.conf.json=${ex_tauri}"
          if [ "$tag" != "$ex_tauri" ]; then
            echo "::error::tag v${tag} 与 tauri.conf.json 的 version=${ex_tauri} 不一致"
            rc=1
          fi

          exit $rc

  # ══════════════════════════════════════════════════════════════════
  # 桌面产物构建：windows / macOS(arm64 + x64) / linux
  # ══════════════════════════════════════════════════════════════════
  build:
    name: 构建 ${{ matrix.label }}
    needs: version-check
    runs-on: ${{ matrix.platform }}
    strategy:
      # 一个平台失败不取消其他平台：先拿到能拿的产物，再看日志。
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - label: windows-x64
            platform: windows-latest
            # 只出 NSIS，不跟着 `tauri.conf.json` 的 `targets: "all"` 走。
            # Windows 上 "all" = nsis + **msi**，而 MSI 需要 tauri-bundler 在
            # 构建期去 GitHub Releases 下载 WiX v3.14 工具链——那是一次额外的
            # 网络依赖，失败时整条 Windows 腿红掉、连 NSIS 也拿不到（本机实测：
            # `Downloading .../wix314-binaries.zip` 失败即 `failed to bundle
            # project`）。NSIS 是 Windows 侧主安装包格式，先保证它确定可出。
            # MSI 待补齐 WiX 依赖后再加回（见 CHANGELOG「已知债务」）。
            args: '--bundles nsis'
            rust-targets: ''
          - label: macos-arm64
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - label: macos-x64
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ── Linux 系统依赖（webkit2gtk 系列 + 打包工具）──────────────
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            rpm

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.rust-targets }}

      # 缓存示例工程（被 workspace `exclude`，是独立依赖树）。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/minimal-app/src-tauri -> target

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # tauri.conf.json 的 `frontendDist` 是 `../dist`，而 `dist/` 不入版本库
      # —— 必须先构建前端，否则 tauri build 会因为找不到前端产物而失败。
      # 用 `pnpm -r build` 而不是只 build minimal-app：它依赖 `@tauron/core`
      # 等 workspace 包，那些包的 dist/ 也得先在。
      - name: 构建前端
        run: pnpm -r build

      # 示例工程自带 Cargo.lock（独立依赖树）。先做一次**必然生效**的锁文件校验：
      # `tauri build` 没有 `--locked` 选项，靠 `-- --locked` 透传给 cargo 属于
      # 未文档化行为，不能当作可复现性的保证。这一步用 `cargo metadata --locked`
      # 硬校验「锁文件与 Cargo.toml 一致」，不一致直接红，而不是打出一个依赖树
      # 与提交不符的安装包。
      # ⚠️ `shell: bash` 不能删。windows runner 上 `run:` 默认走 pwsh，而 `\`
      # 续行是 bash 语法（pwsh 的续行是反引号 `` ` ``）。没有这行时，Windows 腿
      # 会把三行拆成三条独立语句，第一条变成「`cargo metadata` 带一个 `\` 参数」
      # → cargo 非零退出 → 步骤失败 → 整条 Windows 腿失败 → `release` job
      # （needs: build）不执行。v0.1.0 首次 Release 实测就卡在这里（1m6s，
      # step 10 failure，tauri build / 收集产物 均被 skip）。
      - name: 校验示例工程锁文件
        shell: bash
        run: |
          cargo metadata \
            --manifest-path examples/minimal-app/src-tauri/Cargo.toml \
            --locked --format-version 1 > /dev/null
          echo "examples/minimal-app/src-tauri/Cargo.lock 与 Cargo.toml 一致"

      - name: tauri build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: examples/minimal-app
          # 示例工程 package.json 里声明的脚本就是 `pnpm dlx @tauri-apps/cli@2`，
          # 直接复用它，避免在 CI 里另装一份 CLI。
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      - name: 收集产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.label }}
          # 不带 --target 时产物在 target/release/bundle，
          # 带 --target 时在 target/<triple>/release/bundle。
          path: |
            examples/minimal-app/src-tauri/target/release/bundle/**
            examples/minimal-app/src-tauri/target/*/release/bundle/**
          if-no-files-found: error
          # 安装包本身已压缩，再压一遍没有收益。
          compression-level: 0

  registry-check:
    name: 确认 SDK packages 已公开发布
    needs: version-check
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: npm and crates.io versions must already exist
        run: node scripts/check-published-versions.mjs "${GITHUB_REF_NAME#v}"

  # ══════════════════════════════════════════════════════════════════
  # 汇总发布：单点创建 Release，避免 4 个 matrix 分支并发写同一个
  # Release 造成的竞态。
  # ══════════════════════════════════════════════════════════════════
  release:
    name: 创建 GitHub Release
    needs: [build, registry-check]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: |
          echo "── download-artifact 摊平后的全部文件 ──"
          find artifacts -type f | sort
          echo "── 其中会被上传为 release asset 的安装包 ──"
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) | sort

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # Release 页以公开 SDK registry 发布说明为主体，并保留示例应用安装包资产。
          draft: false
          generate_release_notes: false
          overwrite_files: true
          # `body` 会**前置**到自动生成的 notes（action README：the body will be
          # pre-pended to the automatically generated notes），因此这里是给 Releases
          # 页面访问者的「这是什么 / 下载哪个 / 安装前必读 / 装完怎么自检」，后面
          # 接的是本版本完整提交列表。文案与 docs/installation.md 保持一致。
          body: |
            ## tauron ${{ github.ref_name }}

            **Tauron SDK v1 正式版**：20 个 npm 包与 15 个 Rust crate 已发布到各自的
            公共 registry。GitHub 上的安装包是 `examples/minimal-app` 演示客户端，不是
            Tauron SDK 本身的安装器。

            ### 第三方 Tauri 2 项目快速接入

            ```bash
            npm create tauron-app@1.0.2 -- ./my-app --framework react
            cd my-app
            npm install
            npm run tauri dev
            ```

            前端支持 React、Vue、Svelte 与原生 TypeScript。已有 Tauri 2 项目可用
            `npx @tauron/app-cli@1.0.2 init --dir ./my-app`；已有命令处理器与权限配置会保留，
            需要手工合并时 CLI 会明确报告。其他宿主必须实现自己的 `Backend` / `HostTransport`
            适配，Tauron v1 不承诺同一安装器覆盖所有客户端。

            - [安装与使用](https://github.com/coeasy/tauron/blob/main/docs/installation.md)
            - [Tauron v1 支持边界](https://github.com/coeasy/tauron/blob/main/docs/integration/support-boundary.md)
            - [渐进接入指南](https://github.com/coeasy/tauron/blob/main/docs/integration/incremental-adoption.md)

            ### 演示客户端安装包

            以下资产用于体验示例应用，不代表 SDK 安装包。

            | 平台 | 文件 | 格式 |
            |---|---|---|
            | Windows x64 | `Tauron Minimal App_<version>_x64-setup.exe` | NSIS 安装包 |
            | macOS（Apple Silicon） | `..._aarch64.dmg` | 磁盘映像 |
            | macOS（Intel） | `..._x64.dmg` | 磁盘映像 |
            | Linux | `..._amd64.deb` / `..._x86_64.rpm` / `..._amd64.AppImage` | 三种任选 |

            ### ⚠️ 安装前必读

            - **安装包未签名、未公证**：Windows 会弹 SmartScreen（点「更多信息」→
              「仍要运行」），macOS 会被 Gatekeeper 拦（右键点图标 → 打开）。**这不是
              安装包坏了。**
            - **Windows 只提供 NSIS，不提供 MSI**：MSI 需要构建期下载 WiX 工具链，
              属额外网络依赖，失败时会连 NSIS 一起拿不到。
            - 图标是示例图标（由 `app-icon.svg` 生成的几何标记），非正式品牌资产。

            ### 装完怎么确认演示链路可用

            启动后有四条可点的演示链路：**格式化**（沙箱插件握手）/ **最小化窗口** /
            **读剪贴板** / **检查更新**。四条都点得出反应，说明
            Rust 命令层 ↔ Tauri IPC ↔ 前端适配层这条主链是通的。

            > 「检查更新」目前会明确说明更新源未接入；不会把模拟响应显示为「已是最新」。
            > 本项目刻意区分真实实现与接口占位，不伪造成功。

            插件面板会在打开后注册 `formatter.format` 命令；命令面板可把它投递给插件，
            主窗也可单独进行跨主体调用。

            ### 文档

            - [架构概览](https://github.com/coeasy/tauron/blob/main/docs/architecture/overview.md)
              —— 含「接线状态（诚实披露）」
            - [CHANGELOG / 已知债务](https://github.com/coeasy/tauron/blob/main/CHANGELOG.md)
              —— 运行时成熟度、平台打包限制与已知边界

            ---
          # 只上传真正的安装包，**不要**写 `artifacts/**/*`。
          # `download-artifact` 会把 macOS 的 `Tauron Minimal App.app` 整棵目录树
          # 摊进 artifacts/，宽 glob 会把 .app 内部的 Info.plist / icon.icns /
          # Contents/MacOS 里的可执行文件都当成一个个独立 release asset 上传；
          # 两个 macOS 架构的同名内部文件还会互相覆盖。按扩展名挑才只留安装包。
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
