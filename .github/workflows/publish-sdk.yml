name: Publish SDK packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the versioned npm and crates.io packages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    if: inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Verify the create-tauron-app launcher before publishing
        run: node scripts/verify-create-tauron-app.mjs
      - run: cargo test --workspace --locked
      - run: pnpm publish:npm -- --check
      # The crate preflight intentionally uses --offline so it can validate
      # crates whose internal dependencies are not on crates.io yet. Cargo test
      # may not fetch target-only crates, so warm every locked platform dependency.
      - name: Fetch locked Rust dependencies for offline package preflight
        run: cargo fetch --locked
      - run: pnpm publish:crates -- --check
      - name: Require registry publish credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$NPM_TOKEN" || { echo "Missing NPM_TOKEN repository secret"; exit 1; }
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "Missing CARGO_REGISTRY_TOKEN repository secret"; exit 1; }
      - name: Verify registry package names and ownership
        run: node scripts/check-registry-ownership.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES_IO_PUBLISHER: coeasy

  publish-npm:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm publish:npm -- --publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-crates:
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fetch --locked
      - run: node scripts/publish-crates.mjs --publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  verify-clean-consumer:
    needs: publish-crates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
      - name: Wait for registry propagation
        shell: pwsh
        run: Start-Sleep -Seconds 60
      - name: Install and build from public registries in clean directories
        run: node scripts/verify-registry-consumer.mjs
