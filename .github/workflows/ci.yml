name: CI

# 触发：main 的 push、所有 PR、以及手动触发。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一 ref 上连发 push 时取消旧运行，避免排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # ══════════════════════════════════════════════════════════════════
  # TypeScript：build → typecheck → test
  #
  # ⚠️ 顺序不可换。`@tauron/*` 之间以 `workspace:*` 互引，测试是从 `dist/`
  # 解析导入的；不先 build 会得到一批 "Failed to resolve import" 的**假失败**
  # （本仓库踩过这个坑）。根 package.json 的 `verify` 脚本就是这个顺序，
  # 这里拆成独立 step 只是为了失败时能一眼看出卡在哪一步。
  # ══════════════════════════════════════════════════════════════════
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm

      # pnpm 11 默认拒绝依赖的 postinstall 脚本；`pnpm-workspace.yaml` 的
      # `allowBuilds` 已放行 esbuild（vitest 依赖它的平台二进制）。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（第 1 步，不可省）
        run: pnpm -r build

      - name: 类型检查（第 2 步）
        run: pnpm -r --no-bail typecheck

      # ESLint 现在是 **0 error / 0 warning**（原「已知债务」第 3 条的 81 条 warning
      # 已清零），因此 `--max-warnings 0` 是硬门禁：warning 与 error 都会非零退出。
      # 这条口径由根 `package.json` 的 `lint` 脚本承载，本地与 CI 同一条命令。
      - name: Lint（ESLint，0 error / 0 warning）
        run: pnpm lint

      # 格式门禁（原「已知债务」第 2 条）：全仓已一次性 `pnpm format` 规范化为
      # Prettier 风格，因此这是硬门禁——再出现差异就是新引入的未格式化文件。
      # 忽略清单见 .prettierignore（Markdown 有意排除：文档是人工排版的中文长文）。
      - name: 格式检查（Prettier）
        shell: bash
        run: |
          if ! pnpm format:check; then
            echo "::group::Prettier exact diff"
            pnpm format
            git diff -- .
            echo "::endgroup::"
            exit 1
          fi

      - name: Public Surface Ledger（V4 A105）
        run: node scripts/generate-public-surface-ledger.mjs --check

      - name: Target Matrix Drift（V4 A99）
        run: node scripts/check-target-matrix.mjs --check

      - name: Release Evidence 输入校验（V4 A110）
        run: node scripts/generate-release-evidence.mjs --check

      - name: No-Lock-Across-Await（V4 A104）
        run: node scripts/check-no-lock-across-await.mjs

      - name: 测试（第 3 步）
        run: pnpm -r --no-bail test

      # wire-gate 在 `pnpm -r test` 里已经跑过。这里再单独跑一次，是为了让
      # 「TS↔Rust 契约被破坏」这件事在 CI 摘要里**一眼可见**，而不是淹在
      # 1500+ 条用例的输出里。它直接正则解析 Rust 源码文本做断言，是唯一
      # 能拦住「改了 Rust 侧字段名但没改 TS 侧」的门。
      - name: 跨语言契约门禁（wire-gate）
        run: pnpm --filter @tauron/contract-tests exec vitest run src/wire-gate.test.ts

      # 发布就绪门禁（原「已知债务」第 6 条）：19 个可发布包必须「打得出来」。
      # `--check` 逐包 `pnpm pack` 并**解包**校验：含 `dist/`、入口文件齐全、
      # 无 `workspace:` 残留。**必须用 pnpm**：`npm pack` 会把 `workspace:*`
      # 原样写进 tarball，registry 侧解析直接报 `EUNSUPPORTEDPROTOCOL`
      # （本机解包实测结论）。脚本默认只校验不发布，真发布需显式 `--publish` + token。
      - name: 发布产物校验（npm 打包内容）
        run: pnpm publish:npm -- --check

  # V4 A99: every official OS/arch row executes the same host-neutral conformance surface on a
  # native runner. Tauri packaging is additionally exercised by release.yml on the same rows.
  target-matrix:
    name: Target Matrix (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            local-host: true
          - label: windows-x64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            local-host: true
          - label: macos-arm64
            runner: macos-15
            rust-target: aarch64-apple-darwin
            local-host: true
          - label: macos-x64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
            local-host: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Host conformance
        run: cargo test -p tauron-host --test v4_host_conformance --locked

      - name: Process runtime contract
        run: cargo test -p tauron-proc --locked

      - name: FFI ownership contract
        run: cargo test -p tauron-ffi --locked

      - name: WASM broker contract
        run: cargo test -p tauron-wasm --locked

      - name: Minimal substrate profile
        run: cargo check -p tauron-adapter --no-default-features --locked

      - name: Local broker chaos
        run: cargo test -p tauron-host --test v4_local_host_chaos --locked

      - name: Local Host reference E2E
        if: matrix.local-host == true
        run: cargo run -p tauron-host --example local_host_reference --locked

      - name: Remote TLS reference E2E
        run: cargo run -p tauron-host --example remote_host_tls_reference --locked

  # ══════════════════════════════════════════════════════════════════
  # Rust 底座线：默认特性。
  # `tauri` 在 tauron-shell / tauron-adapter 里都是 **optional**，默认构建
  # 完全不碰它 —— 因此这一步不需要任何系统库（webkit2gtk 等），可以跑在
  # 最便宜的 runner 上。这是本仓库「核心逻辑离线可测」的设计在 CI 上的兑现。
  # ══════════════════════════════════════════════════════════════════
  rust:
    name: Rust (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # V4 minimal-profile proof: default adapter must not pull extension install deps.
      - name: 最小底座依赖门禁
        run: |
          cargo tree -p tauron-adapter --no-default-features -e normal > /tmp/tauron-minimal-tree.txt
          if grep -E 'tauron-(market|acl)|(^| )zip v|ed25519-dalek' /tmp/tauron-minimal-tree.txt; then
            echo "minimal tauron-adapter unexpectedly pulls plugin-install dependencies" >&2
            exit 1
          fi

      # `--locked` 是硬要求：本仓库提交 Cargo.lock，构建必须可复现。
      - name: 测试
        run: cargo test --workspace --locked

      - name: V4 Host Conformance（transport-neutral）
        run: cargo test -p tauron-host --test v4_host_conformance --locked

      # V4 A72/A107: build the real cdylib, link a foreign C consumer, then exercise
      # retain/release/buffer/error/shutdown ownership under AddressSanitizer.
      - name: FFI Ownership / ASan（V4 A72/A107）
        shell: bash
        run: |
          cargo build -p tauron-ffi --locked
          cc -std=c11 -Wall -Wextra -Werror             -fsanitize=address -fno-omit-frame-pointer             -I crates/tauron-ffi/include             crates/tauron-ffi/conformance/c/ffi_ownership_asan.c             -L target/debug             -Wl,-rpath,"$PWD/target/debug"             -ltauron_ffi             -o /tmp/tauron-ffi-asan
          LD_LIBRARY_PATH="$PWD/target/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"             ASAN_OPTIONS=detect_leaks=1:halt_on_error=1             /tmp/tauron-ffi-asan

      - name: Local Host UDS reference E2E（V4 A106）
        if: runner.os == 'Linux'
        run: cargo run -p tauron-host --example local_host_reference --locked

      - name: Local Host broker chaos / peer-auth（V4 A108 local）
        run: cargo test -p tauron-host --test v4_local_host_chaos --locked

      - name: Remote Host session/replay/rate-limit chaos（V4 A108 remote contract）
        run: cargo test -p tauron-host --test v4_remote_host_chaos --locked

      - name: Remote Host rustls TLS1.3 reference E2E（V4 A106/A108）
        run: cargo run -p tauron-host --example remote_host_tls_reference --locked

      # 抓「只在某个 target 下才编译到的死代码 / 未用导入」。
      # 本仓库的历史缺陷类型之一是「有类型、有接口、有测试、没有入口」，
      # 编译全 target 是第一道筛子。
      - name: 编译检查（全部 target）
        run: cargo check --workspace --all-targets --locked

      # 发布就绪门禁（原「已知债务」第 5 条）：内部互引用的坐标必须「可打包」。
      # `cargo package` 会在剥离 `path` 之后校验每个内部依赖是否**同时给出了
      # `version`**——缺 version 会在这里红掉，而不是等到 `cargo publish` 才发现。
      # `--no-verify` 只做打包与产物 manifest 校验，不重复编译（上面两步已覆盖编译）。
      # `--offline` 让这一步不碰网络（依赖已由上面的 `cargo test` 拉进缓存）。
      - name: 打包校验（发布就绪）
        run: cargo package --workspace --no-verify --allow-dirty --offline

  # ══════════════════════════════════════════════════════════════════
  # Rust 应用层：`tauri` feature + 示例工程。
  # 打开 tauri 会引入 wry → Linux 上需要 webkit2gtk 系列系统库。
  # ══════════════════════════════════════════════════════════════════
  rust-tauri:
    name: Rust (tauri feature)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Tauri 的 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: 测试 tauron-shell（tauri feature）
        run: cargo test -p tauron-shell --features tauri --locked

      - name: 测试 tauron-adapter（tauri feature）
        run: cargo test -p tauron-adapter --features tauri --locked

      # 全 feature 组合的编译检查。放在这个 job 里是因为 `--all-features`
      # 会打开 tauri，需要上面那批系统库。
      - name: 全特性编译检查
        run: cargo check --workspace --all-targets --all-features --locked

  # ══════════════════════════════════════════════════════════════════
  # 示例工程「任意宿主底座」装配路径（硬门禁）
  #
  # 这是方案 §9-1 验收标准 1 的命令，取自
  # `examples/minimal-app/src-tauri/Cargo.toml` 的注释：只 manage 底座状态、
  # 不建 PluginRuntimeState、不注册插件命令，证明「底座可以脱离插件框架
  # 单独装配」。
  #
  # 该工程被 workspace `exclude`，是独立依赖树（自带 Cargo.lock，需单独缓存与
  # `--locked` 校验）。图标已补齐；这条验收路径作为硬门禁，防止示例底座装配断裂。
  # ══════════════════════════════════════════════════════════════════
  example-substrate-only:
    name: 示例工程 substrate-only
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Tauri 的 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/minimal-app/src-tauri -> target

      # tauri-build 会校验 `frontendDist`（../dist）存在，而 `dist/` 是构建
      # 产物、不入版本库。这里造一个占位，避免 `cargo check` 被无关原因绊倒。
      # 真实产物由 release 工作流构建。
      - name: 占位前端产物
        run: mkdir -p examples/minimal-app/dist && echo '<!doctype html>' > examples/minimal-app/dist/index.html

      - name: cargo check --features substrate-only
        run: |
          # --locked：示例工程自带 Cargo.lock（独立依赖树，`exclude` 在主 workspace 外）。
          # 不加它，CI 可能解析出与提交的锁文件不同的依赖树，"本地能过、CI 过不了"
          # 或反之，且构建不可复现。
          cargo check \
            --manifest-path examples/minimal-app/src-tauri/Cargo.toml \
            --features substrate-only \
            --all-targets \
            --locked

  # V4 A29/A110: deterministic regression ceilings for the canonical Wire hot path, peak RSS
  # and native reference binary size. Exact measurements are uploaded and later embedded into
  # Release Evidence for the same SHA.
  performance-size:
    name: Performance / Size
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release probes
        run: |
          cargo build -p tauron-host --example perf_probe --release --locked
          cargo build -p tauron-host --example local_host_reference --release --locked
          cargo build -p tauron-ffi --release --locked

      - name: Runtime / binary budgets
        run: |
          target/release/examples/perf_probe > /tmp/tauron-perf-probe.json
          node scripts/check-performance-size.mjs \
            --probe=/tmp/tauron-perf-probe.json \
            --ffi=target/release/libtauron_ffi.so \
            --local-host=target/release/examples/local_host_reference \
            --out=performance-evidence/performance-size-report.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-size-report
          path: performance-evidence/performance-size-report.json
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════════
  # 代码卫生：rustfmt + clippy，均为**硬门禁**（无 continue-on-error）。
  #
  # 历史上两者从未在本仓库跑过，一次 `--check` 会报全量差异。规范化轮
  # 已一次性 `cargo fmt --all` 并把 clippy 清零，二者现已转正——再出现
  # 差异或 lint 就是**新引入**的问题，正是门禁该拦的东西。
  # 阈值类配置见 rustfmt.toml / clippy.toml。
  # ══════════════════════════════════════════════════════════════════
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # V4 production gate: licenses / bans / sources / RustSec are release safety facts.
  # Any exception must be explicit in deny.toml with a review trail; CI itself is not advisory.
  deny:
    name: cargo-deny（hard gate）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
