name: CI

# 触发：main 的 push、所有 PR、以及手动触发。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一 ref 上连发 push 时取消旧运行，避免排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # ══════════════════════════════════════════════════════════════════
  # TypeScript：build → typecheck → test
  #
  # ⚠️ 顺序不可换。`@tauron/*` 之间以 `workspace:*` 互引，测试是从 `dist/`
  # 解析导入的；不先 build 会得到一批 "Failed to resolve import" 的**假失败**
  # （本仓库踩过这个坑）。根 package.json 的 `verify` 脚本就是这个顺序，
  # 这里拆成独立 step 只是为了失败时能一眼看出卡在哪一步。
  # ══════════════════════════════════════════════════════════════════
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pnpm 11 默认拒绝依赖的 postinstall 脚本；`pnpm-workspace.yaml` 的
      # `allowBuilds` 已放行 esbuild（vitest 依赖它的平台二进制）。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（第 1 步，不可省）
        run: pnpm -r build

      - name: 类型检查（第 2 步）
        run: pnpm -r --no-bail typecheck

      # ESLint 现在是 **0 error / 0 warning**（原「已知债务」第 3 条的 81 条 warning
      # 已清零），因此 `--max-warnings 0` 是硬门禁：warning 与 error 都会非零退出。
      # 这条口径由根 `package.json` 的 `lint` 脚本承载，本地与 CI 同一条命令。
      - name: Lint（ESLint，0 error / 0 warning）
        run: pnpm lint

      # 格式门禁（原「已知债务」第 2 条）：全仓已一次性 `pnpm format` 规范化为
      # Prettier 风格，因此这是硬门禁——再出现差异就是新引入的未格式化文件。
      # 忽略清单见 .prettierignore（Markdown 有意排除：文档是人工排版的中文长文）。
      - name: 格式检查（Prettier）
        run: pnpm format:check

      - name: 测试（第 3 步）
        run: pnpm -r --no-bail test

      # wire-gate 在 `pnpm -r test` 里已经跑过。这里再单独跑一次，是为了让
      # 「TS↔Rust 契约被破坏」这件事在 CI 摘要里**一眼可见**，而不是淹在
      # 1500+ 条用例的输出里。它直接正则解析 Rust 源码文本做断言，是唯一
      # 能拦住「改了 Rust 侧字段名但没改 TS 侧」的门。
      - name: 跨语言契约门禁（wire-gate）
        run: pnpm --filter @tauron/contract-tests exec vitest run src/wire-gate.test.ts

      # 发布就绪门禁（原「已知债务」第 6 条）：19 个可发布包必须「打得出来」。
      # `--check` 逐包 `pnpm pack` 并**解包**校验：含 `dist/`、入口文件齐全、
      # 无 `workspace:` 残留。**必须用 pnpm**：`npm pack` 会把 `workspace:*`
      # 原样写进 tarball，registry 侧解析直接报 `EUNSUPPORTEDPROTOCOL`
      # （本机解包实测结论）。脚本默认只校验不发布，真发布需显式 `--publish` + token。
      - name: 发布产物校验（npm 打包内容）
        run: pnpm publish:npm -- --check

  # ══════════════════════════════════════════════════════════════════
  # Rust 底座线：默认特性。
  # `tauri` 在 tauron-shell / tauron-adapter 里都是 **optional**，默认构建
  # 完全不碰它 —— 因此这一步不需要任何系统库（webkit2gtk 等），可以跑在
  # 最便宜的 runner 上。这是本仓库「核心逻辑离线可测」的设计在 CI 上的兑现。
  # ══════════════════════════════════════════════════════════════════
  rust:
    name: Rust (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `--locked` 是硬要求：本仓库提交 Cargo.lock，构建必须可复现。
      - name: 测试
        run: cargo test --workspace --locked

      # 抓「只在某个 target 下才编译到的死代码 / 未用导入」。
      # 本仓库的历史缺陷类型之一是「有类型、有接口、有测试、没有入口」，
      # 编译全 target 是第一道筛子。
      - name: 编译检查（全部 target）
        run: cargo check --workspace --all-targets --locked

      # 发布就绪门禁（原「已知债务」第 5 条）：内部互引用的坐标必须「可打包」。
      # `cargo package` 会在剥离 `path` 之后校验每个内部依赖是否**同时给出了
      # `version`**——缺 version 会在这里红掉，而不是等到 `cargo publish` 才发现。
      # `--no-verify` 只做打包与产物 manifest 校验，不重复编译（上面两步已覆盖编译）。
      # `--offline` 让这一步不碰网络（依赖已由上面的 `cargo test` 拉进缓存）。
      - name: 打包校验（发布就绪）
        run: cargo package --workspace --no-verify --allow-dirty --offline

  # ══════════════════════════════════════════════════════════════════
  # Rust 应用层：`tauri` feature + 示例工程。
  # 打开 tauri 会引入 wry → Linux 上需要 webkit2gtk 系列系统库。
  # ══════════════════════════════════════════════════════════════════
  rust-tauri:
    name: Rust (tauri feature)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Tauri 的 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 测试 tauron-shell（tauri feature）
        run: cargo test -p tauron-shell --features tauri --locked

      - name: 测试 tauron-adapter（tauri feature）
        run: cargo test -p tauron-adapter --features tauri --locked

      # 全 feature 组合的编译检查。放在这个 job 里是因为 `--all-features`
      # 会打开 tauri，需要上面那批系统库。
      - name: 全特性编译检查
        run: cargo check --workspace --all-targets --all-features --locked

  # ══════════════════════════════════════════════════════════════════
  # 示例工程「任意宿主底座」装配路径（硬门禁）
  #
  # 这是方案 §9-1 验收标准 1 的命令，取自
  # `examples/minimal-app/src-tauri/Cargo.toml` 的注释：只 manage 底座状态、
  # 不建 PluginRuntimeState、不注册插件命令，证明「底座可以脱离插件框架
  # 单独装配」。
  #
  # 该工程被 workspace `exclude`，是独立依赖树（自带 Cargo.lock，需单独缓存与
  # `--locked` 校验）。图标已补齐；这条验收路径作为硬门禁，防止示例底座装配断裂。
  # ══════════════════════════════════════════════════════════════════
  example-substrate-only:
    name: 示例工程 substrate-only
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Tauri 的 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/minimal-app/src-tauri -> target

      # tauri-build 会校验 `frontendDist`（../dist）存在，而 `dist/` 是构建
      # 产物、不入版本库。这里造一个占位，避免 `cargo check` 被无关原因绊倒。
      # 真实产物由 release 工作流构建。
      - name: 占位前端产物
        run: mkdir -p examples/minimal-app/dist && echo '<!doctype html>' > examples/minimal-app/dist/index.html

      - name: cargo check --features substrate-only
        run: |
          # --locked：示例工程自带 Cargo.lock（独立依赖树，`exclude` 在主 workspace 外）。
          # 不加它，CI 可能解析出与提交的锁文件不同的依赖树，"本地能过、CI 过不了"
          # 或反之，且构建不可复现。
          cargo check \
            --manifest-path examples/minimal-app/src-tauri/Cargo.toml \
            --features substrate-only \
            --all-targets \
            --locked

  # ══════════════════════════════════════════════════════════════════
  # 代码卫生：rustfmt + clippy，均为**硬门禁**（无 continue-on-error）。
  #
  # 历史上两者从未在本仓库跑过，一次 `--check` 会报全量差异。规范化轮
  # 已一次性 `cargo fmt --all` 并把 clippy 清零，二者现已转正——再出现
  # 差异或 lint 就是**新引入**的问题，正是门禁该拦的东西。
  # 阈值类配置见 rustfmt.toml / clippy.toml。
  # ══════════════════════════════════════════════════════════════════
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # V4 industrial gate: supply-chain policy is release-blocking. New advisories must be
  # explicitly remediated or granted a time-bounded documented exception; never silently green.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: embarkstudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
